name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Fast feedback: types, lint, and every unit test ────────────────────────
  verify:
    name: typecheck · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the content bundle
        run: npm run content:build

      # The bundle is committed so serverless builds do not need the working
      # tree. If regenerating it produces a diff, the commit is stale.
      - name: Check the committed content bundle is current
        run: git diff --exit-code apps/api/src/content/generated-content.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests — shared library
        run: npm run test:shared

      - name: Unit tests — NestJS API
        run: npm run test:api

      - name: Unit tests — Next.js app
        run: npm run test:blog

  # ── The real thing: production build, then drive it in a browser ───────────
  e2e:
    name: build · end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/blog-e2e/test-output
          retention-days: 7
